name: Nasadenie stránky

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: node scripts/plugin-index.mjs
      - name: Adresa stránky na GitHub Pages
        run: |
          sed -i 's|^  baseUrl:.*|  baseUrl: ogimanw.github.io/Dandzny|' quartz.config.yaml
          grep baseUrl quartz.config.yaml
      - run: node quartz/bootstrap-cli.mjs build
      - run: rm -f public/CNAME
      - name: Správca obsahu (admin/)
        run: cp -r admin public/admin
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
